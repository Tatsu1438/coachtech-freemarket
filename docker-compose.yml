services:
  nginx:
    image: nginx:1.21.1
    ports:
      - "8087:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php
    networks:
      - app-network

  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/
    networks:
      - app-network

  mysql:
    platform: linux/amd64
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    command:
      mysqld --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app-network

  phpmyadmin:
    platform: linux/amd64
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - "8083:80"
    networks:
      - app-network

  mailhog:
    platform: linux/amd64
    image: mailhog/mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge